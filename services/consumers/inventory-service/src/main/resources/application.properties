quarkus.http.port=8082

# 2. Endereço do broker do Kafka (onde ele está rodando na sua máquina via Docker)
kafka.bootstrap.servers=kafka:9092

# 3. Configuração do canal de entrada (o nome 'order-in' é você quem escolhe no código Java)
mp.messaging.incoming.order-in.connector=smallrye-kafka
mp.messaging.incoming.order-in.topic=inventory-topic

# 4. Deserializador: como o consumer vai ler a mensagem que chega (ex: String)
mp.messaging.incoming.order-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# 5. O Grupo de Consumidores (Crucial para o Kafka saber quem já leu o que)
mp.messaging.incoming.order-in.group.id=inventory-service-group