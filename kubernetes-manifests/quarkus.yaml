apiVersion: v1
kind: Namespace
metadata:
  name: quarkus-app
---
# 1. Aplicação: producer-billing
apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer-billing
  namespace: quarkus-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer-billing
  template:
    metadata:
      labels:
        app: producer-billing
    spec:
      containers:
        - name: producer-billing
          image: vitoresbr/producer-billing:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: producer-billing-service
  namespace: quarkus-app
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: producer-billing
---
